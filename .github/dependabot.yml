version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
    time: "21:00"
  open-pull-requests-limit: 10
  # Dependabot's gomod updater cannot resolve nested modules: it maps this
  # import path onto the parent module golang.org/x/crypto, whose zip excludes
  # the nested x509roots/fallback directory, so every run died with
  # dependency_file_not_resolvable. The submodule publishes no tags (only
  # pseudo-versions), so it is bumped by hand: go get <path>@<pseudo-version>.
  ignore:
    - dependency-name: "golang.org/x/crypto/x509roots/fallback"
  groups:
    # Security fixes go out on their own and skip the review queue entirely.
    go-security:
      patterns:
        - "*"
      applies-to: security-updates
    # Routine bumps are batched per semver level so that a major bump
    # never rides along silently with a batch of patches. Minor and patch
    # batches are auto-merged by dependabot-auto-merge.yml once CI is green;
    # major batches stop and wait for a human.
    go-minor-patch:
      patterns:
        - "*"
      applies-to: version-updates
      update-types:
        - minor
        - patch
    go-major:
      patterns:
        - "*"
      applies-to: version-updates
      update-types:
        - major
