name: ci

# Runs on every PR (including dependabot's) so that auto-merge has a real
# status check to gate on, and so that a breaking bump can never be merged
# just because "it only touched go.mod".
#
# Also callable as a reusable workflow (`uses: ./.github/workflows/ci.yml`) so
# that a release can never be published from a commit that has not passed
# build/vet/test. See build.yml.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      -
        name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      -
        name: Build
        run: go build ./...
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test -race ./...
