name: build

# Publishing is tag-driven: pushing a tag such as v1.11.3 runs the full ci
# workflow first and only then builds the matrix and publishes the release.
#
# workflow_dispatch is kept for build-only smoke tests. It deliberately does
# NOT publish: under a manual run github.ref_name is the *branch* name, and
# using that as tag_name is what previously produced a release called
# "master". The release step is gated on github.ref actually being a tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      -
        name: Read tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::tag '$tag' is not a version tag (expected vX.Y.Z)"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Stamping version $tag"
          else
            # Manual build-only run: no version stamp, no release.
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Ref '$GITHUB_REF' is not a tag; building without a version stamp."
          fi
      -
        name: Build
        run: >-
          make -j $(nproc) allplus
          NDK_CC_ARM64="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          NDK_CC_ARM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          VERSION=${{ steps.tag.outputs.tag }}
      -
        name: Verify version stamp
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # A release whose binaries do not self-report the tag is a bug, not
          # a cosmetic issue: this is exactly the failure the previous
          # build.yml shipped (binaries reported a pseudo-version).
          # Use the linux-amd64 artifact: the runner cannot execute the
          # darwin or windows ones.
          got=$(./bin/opera-proxy.linux-amd64 -version)
          want="${{ steps.tag.outputs.tag }}"
          echo "binary reports: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got', expected '$want'"
            exit 1
          fi
      -
        name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          tag_name: ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
