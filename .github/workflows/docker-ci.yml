name: docker-ci

# Publishes the Docker image on version tags.
#
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured on this repository,
# so every run of this workflow used to fail at the login step. Rather than
# leaving a permanently red workflow (and alert fatigue that hides real
# failures), the steps are skipped with a warning when the credentials are
# absent. Configure the two secrets to re-enable publishing.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set; skipping the image publish."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Checkout
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docker meta
        if: steps.creds.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      -
        name: Set up QEMU
        if: steps.creds.outputs.present == 'true'
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        if: steps.creds.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        if: steps.creds.outputs.present == 'true'
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/386,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
